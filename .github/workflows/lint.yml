name: Lint

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
   runs-on: ubuntu-24.04
   steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: .node-version
    - run: yarn --ignore-scripts --strict-semver --pure-lockfile
    - run: yarn lint
